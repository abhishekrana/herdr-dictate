# git-cliff config: Conventional Commits to CHANGELOG.md and the GitHub Release
# notes. Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Notable changes, in [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) spirit and versioned with
[SemVer](https://semver.org/).
"""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**breaking** - {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Drop non-conventional commits rather than collecting them into a catch-all.
filter_unconventional = true
filter_commits = false
protect_breaking_commits = true
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "newest"
topo_order = false

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  # Release chores and CI plumbing are noise in a changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", group = "Maintenance" },
  { message = ".*", skip = true },
]
