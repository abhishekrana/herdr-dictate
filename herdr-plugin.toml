id = "abhishekrana.dictate"
name = "Dictate"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Local speech-to-text dictation into the focused Herdr pane"
platforms = ["linux"]

# Fetches the release build when one matches, else compiles. Runs before Herdr
# registers the plugin.
[[build]]
command = ["scripts/fetch-or-build.sh"]

[[actions]]
id = "toggle"
title = "Dictate: toggle"
description = "Start recording, or stop and insert the transcript"
contexts = ["workspace", "pane"]
command = ["./target/release/herdr-dictate", "toggle"]

[[actions]]
id = "toggle-send"
title = "Dictate: toggle and submit"
description = "Same, then press Enter once the transcript lands"
contexts = ["workspace", "pane"]
command = ["./target/release/herdr-dictate", "toggle", "--submit"]

# Opening the shared ssh connection once means the first dictation to a saved
# machine does not pay for a handshake.
[[startup]]
command = ["./target/release/herdr-dictate", "warm"]

[[actions]]
id = "doctor"
title = "Dictate: doctor"
description = "Report the wiring this plugin depends on"
contexts = ["workspace"]
command = ["./target/release/herdr-dictate", "doctor"]

# A pane, not an action: setup asks before writing and needs a terminal.
[[panes]]
id = "setup"
title = "Dictate: setup"
description = "Show the keybindings this plugin needs, and offer to write them"
placement = "split"
command = ["./target/release/herdr-dictate", "setup"]
