[package]
name = "herdr-dictate"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local speech-to-text dictation into the focused Herdr pane"
repository = "https://github.com/abhishekrana/herdr-dictate"
keywords = ["herdr", "dictation", "speech-to-text", "parakeet", "whisper"]
categories = ["command-line-utilities"]

[lib]
name = "herdr_dictate"
path = "src/lib.rs"

[[bin]]
name = "herdr-dictate"
path = "src/main.rs"

[features]
default = []
# Acceleration for the bundled engine. CPU works everywhere; each of these needs
# its own SDK at build time, so release binaries ship one variant per backend.
vulkan = ["transcribe-cpp/vulkan"]
cuda = ["transcribe-cpp/cuda"]
metal = ["transcribe-cpp/metal"]
rocm = ["transcribe-cpp/rocm"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
hound = "3.5"
rustix = { version = "1", features = ["event", "process"] }
sha2 = "0.11"
signal-hook = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
thiserror = "2"
# Its default turns on Metal; the features above choose the backend.
transcribe-cpp = { version = "0.3.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
# No LTO: the work is in transcribe.cpp, which it does not reach.
lto = false
