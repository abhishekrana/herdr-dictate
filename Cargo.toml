[package]
name = "herdr-dictate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Local speech-to-text dictation into the focused Herdr pane"
repository = "https://github.com/abhishekrana/herdr-dictate"
keywords = ["herdr", "dictation", "speech-to-text", "whisper"]
categories = ["command-line-utilities"]

[lib]
name = "herdr_dictate"
path = "src/lib.rs"

[[bin]]
name = "herdr-dictate"
path = "src/main.rs"

[features]
default = []
# Acceleration for the bundled engine. CPU works everywhere; each of these needs
# its own SDK at build time, so release binaries ship one variant per backend.
#
# whisper-rs does not forward whisper-rs-sys's vulkan feature, so it is enabled
# on the sys crate directly. The version must match whisper-rs's own dependency.
vulkan = ["dep:whisper-rs-sys", "whisper-rs-sys/vulkan"]
cuda = ["whisper-rs/cuda"]
metal = ["whisper-rs/metal"]
hipblas = ["whisper-rs/hipblas"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
hound = "3.5"
rustix = { version = "1", features = ["process"] }
sha2 = "0.10"
signal-hook = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
thiserror = "2"
whisper-rs = "0.16"
whisper-rs-sys = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
