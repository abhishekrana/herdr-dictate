name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: nothing here publishes. Releases get their own workflow and their
# own permissions.
permissions:
  contents: read

# A new push to the same ref makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - name: Manifest versions agree
        run: |
          cargo=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin=$(grep -m1 '^version = ' herdr-plugin.toml | cut -d'"' -f2)
          test "$cargo" = "$plugin" || { echo "Cargo.toml $cargo != herdr-plugin.toml $plugin"; exit 1; }

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # No Windows: the socket client uses std::os::unix::net, which is what
        # herdr-plugin.toml declares in `platforms`.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked


  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A bare machine building from source with only the documented dependencies.
  build-from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f test/Dockerfile -t herdr-dictate-src .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # Proves the rust-version in Cargo.toml is honest. Users build this plugin
  # themselves on install, so an MSRV that drifts upward silently is a failed
  # `herdr plugin install` on someone else's machine.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/install-deps.sh
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked
