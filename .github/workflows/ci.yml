name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same script contributors run. Docker is skipped; build-from-source is
  # its own job.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/install-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      # After the toolchain: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2
      - run: scripts/install-dev-tools.sh
      - run: scripts/check.sh
        env:
          SKIP_DOCKER: "1"

  # A bare machine building from source with only the documented dependencies.
  # A runner starts with no layers, so the cache is carried between runs.
  build-from-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: test/Dockerfile
          cache-from: type=gha
          # The cache is an optimisation: a build that passed must not fail
          # because the cache service rejected a layer.
          cache-to: type=gha,mode=max,ignore-error=true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
